name: Build Shopify content and deploy preview

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Install build dependencies
        run: pnpm install --frozen-lockfile

      - name: Check page URLs and storefront behavior
        run: node --test tests/*.test.mjs

      - name: Build Japanese and English pages from published Shopify content
        run: pnpm build

      - name: Verify generated HTML, language links and image files
        run: pnpm check:site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload generated preview
        uses: actions/upload-pages-artifact@v3
        with:
          path: site-build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
